<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Playful preview</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#ffdc66,#ff8ab3 55%,#9175ff);font-family:Arial,sans-serif;color:#372657}.card{width:360px;background:#fffdf7;border:5px solid #372657;border-radius:32px;padding:28px;box-shadow:12px 12px 0 #372657;text-align:center}.badge{display:inline-block;background:#75e6bc;border:3px solid #372657;border-radius:99px;padding:7px 13px;font-weight:bold}h1{font-size:29px;line-height:1.05;margin:20px 0}button{width:100%;background:#ffcf4e;border:3px solid #372657;border-radius:16px;padding:13px;margin:7px 0;font-size:16px;font-weight:bold;cursor:pointer}button:nth-of-type(2){background:#ffa3c3}button:nth-of-type(3){background:#9fe5ff}</style></head><body><main class="card"><span class="badge">☕ QUESTION 1 OF 6</span><h1>Pick your ideal magical sidekick</h1><button>⚡ A brave phoenix</button><button>🧁 A cozy house elf</button><button>✨ A sparkly unicorn</button></main></body></html>
